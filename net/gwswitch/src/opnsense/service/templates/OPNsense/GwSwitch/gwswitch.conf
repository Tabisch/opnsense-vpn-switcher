# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
{% set general = helpers.getNodeByTag('OPNsense.gwswitch.general') %}
[general]
enabled={{ general.enabled|default('0') }}
interval={{ general.interval|default('5') }}
kill_states={{ general.kill_states|default('1') }}

[clients]
{% if general.enabled|default('0') == '1' %}
{%   for client in helpers.toList('OPNsense.gwswitch.clients.client') %}
{%     if client.enabled|default('0') == '1' and client.profile %}
{%       set profile = helpers.getUUID(client.profile) %}
{%       if profile and profile.enabled|default('0') == '1' %}
{{ client.mac|lower }}=gwsw_{{ profile.name|lower }}
{%       endif %}
{%     endif %}
{%   endfor %}
{% endif %}
