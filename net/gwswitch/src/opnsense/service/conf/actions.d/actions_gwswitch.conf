[start]
command:/usr/local/etc/rc.d/gwswitch start
parameters:
type:script
message:Starting gateway switcher watcher

[stop]
command:/usr/local/etc/rc.d/gwswitch stop
parameters:
type:script
message:Stopping gateway switcher watcher

[restart]
command:/usr/local/etc/rc.d/gwswitch restart
parameters:
type:script
message:Restarting gateway switcher watcher
description:Restart the gateway switcher watcher

[status]
command:/usr/local/etc/rc.d/gwswitch status
parameters:
type:script_output
errors:no
message:Requesting gateway switcher watcher status

[refresh]
command:/usr/local/opnsense/scripts/gwswitch/refresh.py
parameters:--aliases %s --macs %s
type:script_output
message:Refreshing gateway switcher aliases %s for %s
description:Reload gateway switcher aliases and drop states of switched clients

[hosts]
command:/usr/local/opnsense/scripts/gwswitch/hosts.py
parameters:
type:script_output
message:Listing hosts for the gateway switcher
